name: CI

on:
- push
- pull_request
- workflow_dispatch

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test with Python ${{ matrix.python }}
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15-dev']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: setup test environment
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: install pip
        run:
          python -m pip install --upgrade pip
      - name: Lint with black
        uses: psf/black@87928e6d6761a4a6d22250e1fee5601b3998086e  # 26.5.1
        with:
          options: "--check --diff"
      - name: Install dependencies
        run:
          python -m pip install -r requirements.txt
      - name: Lint with flake8
        run:
          python -m flake8 .
      - name: Validate static typing with mypy
        run:
          python -m mypy flake8_plugin_utils tests
      - name: isort
        run:
          python -m isort --check-only --verbose flake8_plugin_utils tests
      - name: Test
        run:
          python -m pytest --cov -vv tests
